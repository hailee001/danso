<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lì Xì Đầu Năm - Trung Hải</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --gold: #ffd700;
            --red-fire: #ff4d4d;
        }

        body {
            margin: 0;
            background: radial-gradient(circle, #3a0000 0%, #000000 100%);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        /* Hiệu ứng Header nảy lửa */
        .header-title {
            text-align: center;
            margin: 20px;
            font-size: clamp(1.5rem, 8vw, 2.5rem);
            color: var(--gold);
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.8), 0 0 10px gold;
            animation: glow 1.5s infinite alternate;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 5px red); transform: scale(1); }
            to { filter: drop-shadow(0 0 20px orange); transform: scale(1.05); }
        }

        /* Form đăng ký */
        #auth-container {
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 25px;
            backdrop-filter: blur(15px);
            border: 2px solid var(--gold);
            width: 90%;
            max-width: 380px;
            text-align: center;
            margin-top: 20px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.8);
        }

        input {
            width: 100%;
            padding: 15px;
            margin: 20px 0;
            border-radius: 12px;
            border: 1px solid var(--gold);
            background: rgba(0,0,0,0.7);
            color: white;
            font-size: 16px;
            outline: none;
        }

        /* Vòng quay Mobile Responsive */
        .wheel-outer {
            position: relative;
            width: min(90vw, 420px);
            height: min(90vw, 420px);
            margin: 20px auto;
            display: none;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
            border-radius: 50%;
            border: 8px solid var(--gold);
            box-shadow: 0 0 50px rgba(255, 61, 61, 0.4);
            transition: transform 5s cubic-bezier(0.1, 0, 0.1, 1);
        }

        /* Kim chỉ chính xác */
        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-top: 40px solid var(--gold);
            z-index: 20;
            filter: drop-shadow(0 4px 4px black);
        }

        .spin-btn {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 70px; height: 70px;
            background: radial-gradient(circle, #fff, var(--gold));
            border-radius: 50%;
            z-index: 25;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #800000;
            font-weight: 900;
            border: 4px solid #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            font-size: 14px;
        }

        .main-btn {
            background: linear-gradient(45deg, #d41414, #ff5e5e);
            color: white; padding: 12px 35px;
            border: none; border-radius: 50px;
            font-weight: bold; cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(212, 20, 20, 0.4);
        }

        #user-tag {
            background: rgba(0,0,0,0.5);
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 13px;
            color: #00ffcc;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <h1 class="header-title">🧧 LÌ XÌ ĐẦU NĂM 🧧</h1>

    <div id="auth-container">
        <i class="fas fa-dragon fa-3x" style="color: var(--gold); margin-bottom: 10px;"></i>
        <h3>Nhập Tên Nhận Lộc</h3>
        <input type="text" id="username" placeholder="Ví dụ: Nguyễn Văn A...">
        <button class="main-btn" onclick="startApp()">Vào Quay Ngay</button>
    </div>

    <div id="user-tag"></div>

    <div class="wheel-outer" id="game-zone">
        <div class="pointer"></div>
        <canvas id="wheelCanvas"></canvas>
        <div class="spin-btn" onclick="spinNow()">QUAY</div>
    </div>

    <script>
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        // Thứ tự chuẩn trong mảng
        const prizes = ["5k", "10k", "15k", "20k", "25k", "30k", "35k", "40k", "45k", "50k", "55k", "60k"];
        const colors = ["#e74c3c", "#3498db", "#f1c40f", "#2ecc71", "#9b59b6", "#e67e22", "#1abc9c", "#34495e", "#d35400", "#c0392b", "#8e44ad", "#27ae60"];
        
        let currentRotation = 0;
        let isSpinning = false;
        let userData = { name: "", spins: 0 };

        function drawWheel() {
            const size = 500;
            canvas.width = size; canvas.height = size;
            const center = size / 2;
            const arc = (Math.PI * 2) / prizes.length;

            prizes.forEach((prize, i) => {
                const angle = i * arc;
                ctx.beginPath();
                ctx.fillStyle = colors[i];
                ctx.moveTo(center, center);
                ctx.arc(center, center, center, angle, angle + arc);
                ctx.fill();
                ctx.strokeStyle = "rgba(255,255,255,0.3)";
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.save();
                ctx.translate(center, center);
                ctx.rotate(angle + arc / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "white";
                ctx.font = "bold 24px Arial";
                ctx.shadowColor = "black"; ctx.shadowBlur = 5;
                ctx.fillText(prize, center - 30, 10);
                ctx.restore();
            });
        }

        function startApp() {
            const name = document.getElementById('username').value.trim();
            if (!name) return Swal.fire("Lỗi", "Bạn chưa nhập tên mà!", "error");

            userData.name = name;
            document.getElementById('auth-container').style.display = 'none';
            document.getElementById('game-zone').style.display = 'block';
            document.getElementById('user-tag').style.display = 'block';
            updateUserTag();
            drawWheel();
        }

        function updateUserTag() {
            document.getElementById('user-tag').innerHTML = `<i class="fas fa-user"></i> ${userData.name} | <i class="fas fa-redo"></i> Lượt: ${userData.spins}`;
        }

        function spinNow() {
            if (isSpinning) return;
            isSpinning = true;
            userData.spins++;
            updateUserTag();

            let targetIdx;
            
            // LOGIC TỈ LỆ THEO TỪNG VÒNG (Yêu cầu mới)
            switch(userData.spins) {
                case 1: targetIdx = 1; break; // Vòng 1: 10k (index 1)
                case 2: targetIdx = 0; break; // Vòng 2: 5k (index 0)
                case 3: targetIdx = 1; break; // Vòng 3: 10k (index 1)
                case 4: targetIdx = 11; break; // Vòng 4: 60k (index 11)
                case 5: targetIdx = 9; break; // Vòng 5: 50k (index 9)
                default: 
                    // Từ vòng 6 trở đi ngẫu nhiên 5k, 10k, 15k
                    const r = Math.random();
                    if (r < 0.5) targetIdx = 0;
                    else if (r < 0.8) targetIdx = 1;
                    else targetIdx = 2;
            }

            const arcDeg = 360 / prizes.length; // 30 độ/ô
            const extraSpins = 3600; // Quay 10 vòng cho phê

            // Công thức tính góc dừng chuẩn xác (Kim ở đỉnh 270 độ)
            const stopAngle = 270 - (targetIdx * arcDeg) - (arcDeg / 2);
            
            // Cập nhật góc quay mới (luôn cộng dồn để quay tiếp)
            currentRotation += extraSpins + (stopAngle - (currentRotation % 360));
            if (currentRotation < 0) currentRotation += 360; 

            canvas.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                processResult(prizes[targetIdx]);
            }, 5000);
        }

        function processResult(prize) {
            const val = parseInt(prize);
            
            // Hiệu ứng pháo hoa nếu trúng lớn (60k, 50k)
            if (val >= 40) {
                const duration = 3 * 1000;
                const end = Date.now() + duration;
                (function frame() {
                    confetti({ particleCount: 7, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ff0000', '#ffd700'] });
                    confetti({ particleCount: 7, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ff0000', '#ffd700'] });
                    if (Date.now() < end) requestAnimationFrame(frame);
                }());
            }

            Swal.fire({
                title: `🎉 CHÚC MỪNG: ${prize} 🎉`,
                html: `<p>Bạn đã nhận được lộc từ Trung Hải!</p>
                       <p style="font-size: 13px; margin-top: 15px; color: #ffcc00">
                       <i>Lưu ý: Liên hệ Trung Hải và gửi mã QR, lấy lộc đầu năm nên hoan hỉ nhé ạ tất cả là tùy vào nhân phẩm mỗi người ạ!!</i>
                       </p>`,
                icon: val >= 40 ? 'success' : 'info',
                background: '#220000',
                color: '#fff',
                confirmButtonColor: '#ff3e3e',
                confirmButtonText: 'NHẬN LỘC'
            });

            sendToAdmin(prize);
        }

        function sendToAdmin(prize) {
            const token = "8247031947:AAHcOmle1n0X9L9Elyjy-rdJRBz2COJ0eN4";
            const chatId = "7829265174";
            const msg = `🧧 LÌ XÌ MỚI 🧧\n👤 Khách: ${userData.name}\n🎁 Trúng: ${prize}\n🔢 Lượt quay: ${userData.spins}\n📅 Thời gian: ${new Date().toLocaleString()}`;
            
            fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(msg)}`);
        }
    </script>
</body>
</html>
